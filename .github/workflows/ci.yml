# T21 — CI gate: locked install + typecheck + the offline test sweep, plus the
# image leg (docker build + boot + /health; publishes to GHCR on main).
# Runs on every push and pull request so `main` never goes red silently.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm ci + typecheck + test (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version 24 matches the Dockerfile base and the local dev machine.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile-exact)
        # Native optional packages (@huggingface/transformers → onnxruntime/sharp
        # binaries) can fail to fetch on a flaky runner/registry. One clean retry
        # keeps the gate honest without hiding a deterministic lockfile error.
        run: |
          if ! npm ci --no-audit --no-fund --foreground-scripts; then
            echo "::warning::npm ci failed; clearing the npm cache and retrying once"
            npm cache clean --force || true
            npm ci --no-audit --no-fund --foreground-scripts
          fi

      - name: Typecheck
        run: npm run typecheck

      # Offline by construction: no GEMINI_API_KEY, OPEN_ROUTER_KEY,
      # GEMINI_LIVE_TEST, OPENROUTER_LIVE_TEST, REDIS_LIVE_TEST, CRED_ENC_KEY
      # or DATABASE_URL is set here. The live suites self-skip
      # (openrouter-/gemini-live via describe.skipIf(!LIVE || !HAS_KEY) behind
      # their *_LIVE_TEST flags; redis-live needs REDIS_LIVE_TEST=1), so
      # `vitest run` stays hermetic — zero live spend.
      - name: Test (offline sweep)
        run: npm test

  # T21 — image leg: build the Dockerfile, boot the container, verify /health
  # and the container HEALTHCHECK, then publish to GHCR on main so the image
  # is pullable ("downloadable") without a local build.
  docker:
    name: docker build + boot + /health (publish on main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t relay:ci .

      - name: Boot container and wait for /health
        run: |
          docker run -d --name relay-ci -e PORT=3000 -e EMBEDDING_PROVIDER=local -e SEMANTIC_THRESHOLD=0.80 -p 3000:3000 relay:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "container never became reachable"
            docker logs relay-ci
            exit 1
          fi
          echo "--- /health ---"
          curl -fsS http://127.0.0.1:3000/health
          echo

      # End-to-end proof of the baked embedder: register, seed a prompt (MISS),
      # then ask the same question reworded — answered from the semantic cache
      # with similarity evidence, entirely offline (model baked into the image).
      - name: Semantic smoke (baked embeddings, paraphrase HIT)
        run: |
          KEY=$(curl -fsS -X POST http://127.0.0.1:3000/v1/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","provider":"mock","provider_key":"unused"}' \
            | sed -E 's/.*"key":"([^"]+)".*/\1/')
          test -n "$KEY"
          first=$(curl -fsS -D - -o /dev/null -X POST http://127.0.0.1:3000/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"model":"mock-model","messages":[{"role":"user","content":"What is the capital of France?"}]}')
          echo "$first" | grep -i '^x-cache: miss' || { echo "$first"; exit 1; }
          second=$(curl -fsS -D - -o /dev/null -X POST http://127.0.0.1:3000/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"model":"mock-model","messages":[{"role":"user","content":"Which city is the capital of France?"}]}')
          echo "$second" | grep -i '^x-cache: semantic_hit' || { echo "$second"; exit 1; }
          echo "$second" | grep -i '^x-semantic-similarity: 0\.' || { echo "$second"; exit 1; }

      - name: Verify container HEALTHCHECK turns healthy
        run: |
          for i in $(seq 1 60); do
            st=$(docker inspect --format='{{.State.Health.Status}}' relay-ci)
            [ "$st" = "healthy" ] && break
            sleep 1
          done
          st=$(docker inspect --format='{{.State.Health.Status}}' relay-ci)
          echo "container health: $st"
          [ "$st" = "healthy" ]
          docker rm -f relay-ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag relay:ci "$IMG:latest"
          docker tag relay:ci "$IMG:sha-${GITHUB_SHA::7}"
          docker push "$IMG:latest"
          docker push "$IMG:sha-${GITHUB_SHA::7}"
          echo "published $IMG:latest and $IMG:sha-${GITHUB_SHA::7}"
